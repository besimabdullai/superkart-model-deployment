services:

  backend:
    build: ./backend
    container_name: backend
    restart: unless-stopped
    ports:
      - "7860:7860"

  frontend:
    build: ./frontend
    container_name: frontend
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:7860
    ports:
      - "8501:8501"
    depends_on:
      - backend
